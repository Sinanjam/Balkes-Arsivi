name: Update Balkes Arşivi Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dispatch-web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger web repo rebuild
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEB_REBUILD_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sinanjam/Balkes-Arsivi-Web/dispatches \
            -d '{"event_type":"balkes-archive-updated"}'
